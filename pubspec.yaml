name: ar_live2d_agent
description: AR Live2D Agent 手机端
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  flutter_live2d: ^0.1.0          # 若版本有变更，按官方最新
  flutter_rotation_sensor: ^0.1.0
  web_socket_channel: ^3.0.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  mobile_scanner: ^5.2.3
  shared_preferences: ^2.3.2    # 记住上次连接地址

flutter:
  uses-material-design: true
  assets:
    - resources/models/live2d/              # 放你的 Live2D 模型文件
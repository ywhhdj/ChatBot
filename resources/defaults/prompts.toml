[router]
请判断用户输入的意图类型，只返回JSON格式。
用户输入: "%user_input%"
可能的类型:
- pure_chat: 纯情感聊天、日常对话、无需工具
- tool_call: 明确需要调用某个工具/服务
- ambiguous: 不确定

严格遵循以下JSON返回格式，不准添加额外说明:
{{"type": "pure_chat/tool_call/ambiguous "confidence": 0.0-1.0, "reason": "10字以内简短理由"}}


[compression]
以第三方视角，不要包含闲聊内容，只保留对话中的决策、承诺和行动项。
请压缩以下对话，输出格式必须严格遵循下面的JSON结构：

## 压缩规则
1. 保留所有重要的决策、承诺和行动项
2. 标记未解决的问题和待办事项
3. 识别对话中的关键转折点
4. 保持时间线清晰
5. 区分用户意图和AI响应

## 输出格式（必须严格遵循）
```json
{
  "summary": "一句话总结对话核心内容（不超过50字）
  "key_points": [
    {
      "topic": "话题名称
      "content": "关键信息描述（不超过100字）
      "importance": 1-5的优先级评分
    }
  ],
  "decisions": ["列出的决策列表"],
  "pending_items": ["未解决的问题或待办事项"],
  "user_intent": "用户的最终目标或诉求
  "timeline": [
    {
    "time": "时间点
    "event": "事件描述"
    }
  ]
}
```
## 原始对话
${dialogue}

请严格按照上述JSON格式输出压缩结果，不要添加额外说明。


  colors:
    primary: "#0E6655"
    secondary: "#148F77"
    accent: "#D35400"
    background: "#FFFFFF"
    text: "#17202A"
    muted: "#7B7D7D"
  title_size: 42
  cover_frame: "公司名 + 一句话定位 + 融资轮次与金额"
  body_frame: "标题 + 数据区（左数字右图表）+ 底部要点"
